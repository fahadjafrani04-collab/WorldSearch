
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorldSearch - Explore the World</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #202124;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 22px 7%;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      background: #4285f4;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 23px;
      font-weight: bold;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
    }

    .world {
      color: #4285f4;
    }

    .search {
      color: #20a464;
    }

    main {
      width: 92%;
      max-width: 700px;
      margin: auto;
      text-align: center;
      padding: 55px 0 100px;
    }

    .big-logo {
      font-size: clamp(42px, 9vw, 68px);
      font-weight: bold;
      letter-spacing: -3px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #70757a;
      margin-bottom: 32px;
      font-size: 16px;
    }

    .search-form {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #dadce0;
      border-radius: 35px;
      padding: 7px 8px 7px 20px;
      box-shadow: 0 3px 12px #0000000c;
    }

    .search-form:focus-within {
      box-shadow: 0 3px 16px #0000001a;
    }

    .search-form input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      font-size: 16px;
      padding: 12px 0;
    }

    .search-form button {
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 13px 20px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .search-form button:hover {
      background: #1a73e8;
    }

    .categories {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 25px;
    }

    .category {
      padding: 10px 18px;
      border: 1px solid #dadce0;
      background: white;
      border-radius: 25px;
      cursor: pointer;
      color: #444;
    }

    .category.active,
    .category:hover {
      background: #e8f0fe;
      color: #1967d2;
      border-color: #c6dafc;
    }

    .suggestions {
      margin-top: 45px;
      color: #777;
      font-size: 13px;
    }

    .suggestion {
      display: inline-block;
      margin: 5px 3px;
      padding: 9px 13px;
      border: 1px solid #eee;
      border-radius: 20px;
      background: #fafafa;
      color: #444;
      cursor: pointer;
    }

    .suggestion:hover {
      background: #eef4ff;
    }

    footer {
      padding: 22px;
      background: #f8f9fa;
      color: #70757a;
      text-align: center;
      font-size: 13px;
      border-top: 1px solid #eee;
    }

    @media (max-width: 480px) {
      header {
        padding: 18px 5%;
      }

      main {
        padding: 45px 0 75px;
      }

      .search-form {
        padding-left: 12px;
        gap: 6px;
      }

      .search-form button {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo-icon">W</div>
    <div class="brand">
      <span class="world">World</span><span class="search">Search</span>
    </div>
  </header>

  <main>
    <div class="big-logo">
      <span class="world">World</span><span class="search">Search</span>
    </div>

    <p class="subtitle">
      Discover the world, one search at a time.
    </p>

    <form class="search-form" id="searchForm">
      <span aria-hidden="true">🔎</span>
      <input
        id="searchInput"
        type="search"
        placeholder="Search anything in the world..."
        aria-label="Search the web"
        required
      >
      <button type="submit">Search</button>
    </form>

    <div class="categories">
      <button class="category active" data-type="web">🌐 Web</button>
      <button class="category" data-type="images">🖼️ Images</button>
      <button class="category" data-type="videos">▶ Videos</button>
      <button class="category" data-type="news">📰 News</button>
    </div>

    <div class="suggestions">
      <p>Popular searches</p>
      <button class="suggestion">Technology</button>
      <button class="suggestion">Pakistan</button>
      <button class="suggestion">Space</button>
      <button class="suggestion">Latest News</button>
    </div>
  </main>

  <footer>
    © 2026 WorldSearch | Explore more. Discover everything.
  </footer>

  <script>
    let searchType = "web";

    const input = document.getElementById("searchInput");

    const searchUrls = {
      web: "https://www.google.com/search?q=",
      images: "https://www.google.com/search?tbm=isch&q=",
      videos: "https://www.google.com/search?tbm=vid&q=",
      news: "https://www.google.com/search?tbm=nws&q="
    };

    document.querySelectorAll(".category").forEach(button => {
      button.addEventListener("click", () => {
        searchType = button.dataset.type;

        document.querySelectorAll(".category").forEach(item => {
          item.classList.toggle("active", item === button);
        });
      });
    });

    function searchWeb(query) {
      query = query.trim();

      if (!query) {
        input.focus();
        return;
      }

      const url = searchUrls[searchType] +
        encodeURIComponent(query);

      window.open(url, "_blank", "noopener,noreferrer");
    }

    document.getElementById("searchForm").addEventListener(
      "submit",
      function(event) {
        event.preventDefault();
        searchWeb(input.value);
      }
    );

    document.querySelectorAll(".suggestion").forEach(button => {
      button.addEventListener("click", () => {
        input.value = button.textContent;
        searchWeb(button.textContent);
      });
    });
  </script>

</body>
</html>

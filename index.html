
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorldSearch</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #202124;
      text-align: center;
    }
    header {
      padding: 24px;
      text-align: right;
    }
    header a {
      margin: 10px;
      color: #444;
      text-decoration: none;
    }
    main { margin: 75px auto 30px; padding: 16px; }
    h1 { font-size: 54px; margin-bottom: 30px; }
    .blue { color: #4285f4; }
    .green { color: #34a853; }
    form {
      max-width: 580px;
      margin: auto;
      display: flex;
      border: 1px solid #dfe1e5;
      border-radius: 30px;
      padding: 8px 16px;
    }
    form:focus-within, form:hover {
      box-shadow: 0 1px 6px #ccc;
    }
    input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      font-size: 16px;
      padding: 8px;
    }
    button {
      border: 0;
      border-radius: 22px;
      background: #4285f4;
      color: white;
      padding: 10px 18px;
      cursor: pointer;
    }
    .buttons { margin: 25px; }
    .buttons button {
      margin: 5px;
      background: #f1f3f4;
      color: #333;
    }
    #results {
      max-width: 580px;
      margin: 30px auto;
      text-align: left;
      overflow-wrap: anywhere;
    }
    #results a { color: #1a0dab; }
    .note { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <a href="#" onclick="showInfo(); return false;">About</a>
  </header>

  <main>
    <h1><span class="blue">World</span><span class="green">Search</span></h1>
    <p>Explore the world from one place.</p>

    <form id="searchForm">
      <input id="query" type="search"
        placeholder="Search the web..." required>
      <button type="submit">Search</button>
    </form>
    <div class="gcse-search"></div>

    <div class="buttons">
      <button onclick="searchCategory('web')">Web</button>
      <button onclick="searchCategory('images')">Images</button>
      <button onclick="searchCategory('news')">News</button>
      <button onclick="searchCategory('videos')">Videos</button>
    </div>

    <section id="results"></section>
    
    
<script async src="https://cse.google.com/cse.js?cx=54c8e4553f1ab41a1"></script>
    <p class="note">WorldSearch is under development.</p>
  </main>

  <script>
    const form = document.getElementById('searchForm');
    const queryInput = document.getElementById('query');
    const results = document.getElementById('results');

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      searchCategory('web');
    });

    function searchCategory(category) {
      const query = queryInput.value.trim();
      if (!query) {
        queryInput.focus();
        return;
      }

      let url = 'https://www.google.com/search?q=' +
        encodeURIComponent(query);

      if (category === 'images') {
        url += '&tbm=isch';
      } else if (category === 'news') {
        url += '&tbm=nws';
      } else if (category === 'videos') {
        url += '&tbm=vid';
      }

      results.innerHTML =
        '<h2>Search: ' + escapeHTML(query) + '</h2>' +
        '<p>Your search is ready.</p>' +
        '<p><a href="' + url +
        '" target="_blank" rel="noopener">View ' +
        category + ' results on Google</a></p>' +
        '<p class="note">Full results inside WorldSearch will need a search service.</p>';
    }

    function escapeHTML(text) {
      return text.replace(/[&<>"']/g, function(char) {
        return {
          '&': '&amp;', '<': '&lt;', '>': '&gt;',
          '"': '&quot;', "'": '&#39;'
        }[char];
      });
    }

    function showInfo() {
      alert('WorldSearch is a search website project in development.');
    }
  </script>
</body>
</html>
